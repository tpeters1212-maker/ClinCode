[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clincurate"
version = "0.1.0.dev0"
description = "Local, offline clinical chart abstraction with batch planning and sequential validation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6", "flask>=3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
clincurate = "clincurate.launcher:main"

[tool.setuptools]
packages = ["clincurate"]

[tool.setuptools.package-data]
clincurate = ["schemas/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
