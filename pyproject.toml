[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clincurate"
version = "0.1.0.dev0"
description = "Schema-driven clinical abstraction and sequential validation built on Argilla"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
argilla = ["argilla>=2.8,<2.9"]
dev = ["pytest>=8"]

[project.scripts]
clincurate = "clincurate.cli:main"

[tool.setuptools]
packages = ["clincurate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
